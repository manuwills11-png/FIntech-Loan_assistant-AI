services:
  - type: web
    name: finedge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python ml/train_model.py
    startCommand: python start.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-groq-70b-8192-tool-use-preview
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: TWILIO_SANDBOX_WORD
        sync: false
      # Set this to your deployed Vercel frontend URL after the frontend is
      # deployed, e.g. https://finedge-loan.vercel.app (comma-separate multiple
      # origins if needed). Required — the backend no longer defaults to "*".
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MODEL_PATH
        value: ./ml/loan_risk_model.pkl
